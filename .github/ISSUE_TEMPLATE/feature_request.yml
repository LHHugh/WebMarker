name: Feature Request
description: 提议新功能或体验改进
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请描述你在哪种真实任务中遇到了什么困难
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望 WebMarker 如何帮助你完成这项任务
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可选；说明目前如何绕过这个问题
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议与网页文字标记、管理或阅读体验直接相关
          required: true
