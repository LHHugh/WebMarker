name: Bug Report
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先移除账号、Cookie 和私人网页内容，再提交截图或录屏。
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统与 Chrome 版本
      placeholder: Windows 11 / Chrome 128
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 网页类型或示例地址
      description: 私人页面只需说明类型，不要公开敏感网址
      placeholder: VitePress 文档站 / 可公开访问的 URL
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认提交内容不包含账号、Cookie 或私人网页信息
          required: true
